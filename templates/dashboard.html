<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA AI Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            background: linear-gradient(135deg, #07152f, #102a56);
            color: white;
            text-align: center;
            padding: 42px 20px;
        }

        .logo {
            font-size: 46px;
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 38px;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            color: #9fc5ff;
            font-size: 17px;
        }

        /* =========================
           MAIN
        ========================= */

        .container {
            width: 92%;
            max-width: 1200px;
            margin: 35px auto;
        }

        /* =========================
           REFRESH BUTTON
        ========================= */

        .top-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 25px;
        }

        .refresh {
            border: none;
            background: linear-gradient(135deg, #1677ff, #0057d9);
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 87, 217, 0.20);
        }

        .refresh:hover {
            transform: translateY(-2px);
        }

        /* =========================
           STAT CARDS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .stat-card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            min-height: 155px;
            box-shadow: 0 8px 30px rgba(20, 40, 80, 0.08);
            border-left: 6px solid #1677ff;
        }

        .stat-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #64748b;
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .number {
            font-size: 42px;
            font-weight: 800;
            color: #1677ff;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: #16a34a;
        }

        .status-dot {
            width: 13px;
            height: 13px;
            background: #16a34a;
            border-radius: 50%;
            box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.12);
        }

        .status.offline {
            color: #dc2626;
        }

        .status.offline .status-dot {
            background: #dc2626;
            box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.12);
        }

        /* =========================
           POSTS SECTION
        ========================= */

        .posts-section {
            margin-top: 40px;
        }

        .section-title {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        #posts {
            display: grid;
            gap: 18px;
        }

        .post-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 7px 25px rgba(20, 40, 80, 0.07);
            border-left: 5px solid #1677ff;
        }

        .post-title {
            color: #0f4fbd;
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .post-content {
            color: #526176;
            line-height: 1.7;
            font-size: 15px;
        }

        .post-date {
            margin-top: 14px;
            color: #94a3b8;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 16px;
            color: #64748b;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            color: #64748b;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            text-align: center;
            color: #94a3b8;
            padding: 35px 10px;
            font-size: 13px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {
            .stats {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 30px;
            }

            .number {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>
        <div class="logo">🤖</div>
        <h1>NOVA AI</h1>
        <p>Autonomous AI Persona Dashboard</p>
    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="container">

        <div class="top-bar">
            <button class="refresh" onclick="loadDashboard()">
                🔄 Refresh Dashboard
            </button>
        </div>


        <!-- =========================
             STATISTICS
        ========================= -->

        <section class="stats">

            <div class="stat-card">
                <div class="stat-title">
                    System Status
                </div>

                <div id="status" class="status">
                    <span class="status-dot"></span>
                    Loading...
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-title">
                    Published Posts
                </div>

                <div id="published" class="number">
                    0
                </div>
            </div>


            <div class="stat-card">
                <div class="stat-title">
                    Rejected Topics
                </div>

                <div id="rejected" class="number">
                    0
                </div>
            </div>

        </section>


        <!-- =========================
             LATEST POSTS
        ========================= -->

        <section class="posts-section">

            <h2 class="section-title">
                📝 Latest NOVA Posts
            </h2>

            <div id="posts">
                <div class="loading">
                    Loading NOVA posts...
                </div>
            </div>

        </section>

    </main>


    <footer>
        NOVA AI • Autonomous AI Persona System
    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        const AGENT_ID = "agent-6df7f7566dc6";


        async function loadDashboard() {

            const statusElement =
                document.getElementById("status");

            const publishedElement =
                document.getElementById("published");

            const rejectedElement =
                document.getElementById("rejected");

            const postsContainer =
                document.getElementById("posts");


            /* =========================
               SHOW LOADING
            ========================= */

            statusElement.innerHTML =
                '<span class="status-dot"></span> Loading...';

            postsContainer.innerHTML =
                '<div class="loading">Loading NOVA posts...</div>';


            try {

                /* =========================
                   GET STATUS
                ========================= */

                const statusResponse =
                    await fetch("/status");

                if (!statusResponse.ok) {
                    throw new Error("Status request failed");
                }

                const statusData =
                    await statusResponse.json();


                /* =========================
                   SYSTEM STATUS
                ========================= */

                const currentStatus =
                    statusData.status || "unknown";

                statusElement.innerHTML =
                    '<span class="status-dot"></span>' +
                    currentStatus;


                if (currentStatus.toLowerCase() !== "running") {

                    statusElement.classList.add("offline");

                } else {

                    statusElement.classList.remove("offline");

                }


                /* =========================
                   GET NOVA FEED
                ========================= */

                const feedResponse =
                    await fetch(
                        "/api/agent/feed?agentId=" +
                        encodeURIComponent(AGENT_ID)
                    );


                if (!feedResponse.ok) {
                    throw new Error("Feed request failed");
                }


                const feedData =
                    await feedResponse.json();


                /* =========================
                   READ POSTS
                ========================= */

                const posts =
                    Array.isArray(feedData.posts)
                        ? feedData.posts
                        : [];


                /* =========================
                   COUNTS
                ========================= */

                publishedElement.textContent =
                    posts.length;


                /*
                    If backend provides rejected count,
                    use it. Otherwise keep existing value
                    if available.
                */

                if (
                    typeof feedData.rejected !== "undefined"
                ) {

                    rejectedElement.textContent =
                        feedData.rejected;

                }
                else if (
                    typeof feedData.rejected_topics !== "undefined"
                ) {

                    rejectedElement.textContent =
                        feedData.rejected_topics;

                }


                /* =========================
                   DISPLAY POSTS
                ========================= */

                postsContainer.innerHTML = "";


                if (posts.length === 0) {

                    postsContainer.innerHTML =
                        '<div class="empty">' +
                        'No NOVA posts available.' +
                        '</div>';

                    return;
                }


                /*
                    Show latest posts first
                */

                posts.slice().reverse().forEach(post => {

                    const card =
                        document.createElement("div");

                    card.className = "post-card";


                    const title =
                        post.title ||
                        post.name ||
                        "NOVA Post";


                    const content =
                        post.content ||
                        post.summary ||
                        post.description ||
                        post.text ||
                        "No content available.";


                    const date =
                        post.published ||
                        post.date ||
                        post.created_at ||
                        "";


                    card.innerHTML = `

                        <div class="post-title">
                            🤖 ${escapeHTML(title)}
                        </div>

                        <div class="post-content">
                            ${escapeHTML(content)}
                        </div>

                        ${
                            date
                            ? `<div class="post-date">
                                ${escapeHTML(date)}
                               </div>`
                            : ""
                        }

                    `;


                    postsContainer.appendChild(card);

                });


            }

            catch (error) {

                console.error(
                    "Dashboard error:",
                    error
                );


                statusElement.innerHTML =
                    '<span class="status-dot"></span> Error';


                statusElement.classList.add("offline");


                postsContainer.innerHTML =
                    '<div class="empty">' +
                    'Unable to load NOVA posts.' +
                    '<br><br>' +
                    'Please check that app.py is running.' +
                    '</div>';

            }

        }


        /* =========================
           SAFE HTML
        ========================= */

        function escapeHTML(value) {

            const div =
                document.createElement("div");

            div.textContent =
                value == null
                    ? ""
                    : String(value);

            return div.innerHTML;
        }


        /* =========================
           AUTO LOAD
        ========================= */

        document.addEventListener(
            "DOMContentLoaded",
            loadDashboard
        );

    </script>

</body>
</html>
